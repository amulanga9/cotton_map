function place(){foc.lerp(tf,.08);rad+=(tr-rad)*.08;const h=rad*Math.cos(B);cam.position.set(foc.x+h*Math.sin(A),foc.y+rad*Math.sin(B),foc.z+h*Math.cos(A));cam.lookAt(foc)}
function size(){const w=innerWidth,h=innerHeight;R.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()}
addEventListener('resize',size);size();rad=tr=home();
// ввод
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;let auto=RM?0:1,pd=0,mv=0;const ptr=new Map();
const dist=()=>{const a=[...ptr.values()];return Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1])||1};
const vp=new THREE.Vector3();
function scr(m){vp.copy(m.position);vp.project(cam);return[(vp.x+1)/2*innerWidth,(1-vp.y)/2*innerHeight]}
function near(e){const r=el.getBoundingClientRect();let b=null,bd=40;pts.forEach(m=>{if(!m.visible||(fp>=0&&m.userData.pi!=fp))return;const s=scr(m),d=Math.hypot(s[0]-(e.clientX-r.left),s[1]-(e.clientY-r.top));if(d<bd){bd=d;b=m}});return b}
let pan1=0,drag=0,pp=[0,0],pm=[0,0];
const mid=()=>{const a=[...ptr.values()];return[(a[0][0]+a[1][0])/2,(a[0][1]+a[1][1])/2]};
function pan(dx,dy){const k=rad*.0017,r=new THREE.Vector3().setFromMatrixColumn(cam.matrix,0),u=new THREE.Vector3().setFromMatrixColumn(cam.matrix,1),d=r.multiplyScalar(-dx*k).add(u.multiplyScalar(dy*k));foc.add(d);tf.add(d)}
el.oncontextmenu=e=>e.preventDefault();
el.onpointerdown=e=>{el.setPointerCapture(e.pointerId);ptr.set(e.pointerId,[e.clientX,e.clientY]);mv=0;auto=0;pan1=e.button==2||e.button==1||e.shiftKey||sp;if(pan1)el.style.cursor='grabbing';pp=[e.clientX,e.clientY];if(ptr.size==2){pd=dist();pm=mid()}};
el.onpointermove=e=>{if(ptr.has(e.pointerId)){const o=ptr.get(e.pointerId),dx=e.clientX-o[0],dy=e.clientY-o[1];ptr.set(e.pointerId,[e.clientX,e.clientY]);mv+=Math.abs(dx)+Math.abs(dy);pp=[e.clientX,e.clientY];if(mv>6)drag=1
 if(ptr.size==1){if(pan1)pan(dx,dy);else{A-=dx*.006;B=Math.max(.05,Math.min(1.4,B+dy*.006))}}else{const d=dist(),m=mid();tr=Math.max(5,Math.min(45,tr*pd/d));pd=d;pan(m[0]-pm[0],m[1]-pm[1]);pm=m}}else{hov=near(e);el.style.cursor=hov?'pointer':sp?'grab':''}};
el.onpointerup=e=>{if(ptr.size==1&&mv<6){const m=near(e);m?grab(m):release()}ptr.delete(e.pointerId);if(!ptr.size){drag=0;el.style.cursor=sp?'grab':''}};
el.onpointercancel=e=>{ptr.delete(e.pointerId);if(!ptr.size)drag=0};
el.onwheel=e=>{e.preventDefault();tr=Math.max(5,Math.min(45,tr*(1+e.deltaY*.001)))};
// лапка
let sp=0;
function grab(m){sel=m;show();tf.copy(m.userData.p0);tr=10}
function release(){sel=null;show();tf.set(0,0,0);tr=home()}
addEventListener('keydown',e=>{if(e.code=='Space'){e.preventDefault();if(document.activeElement)document.activeElement.blur();if(!sp){sp=1;el.style.cursor='grab'}}});
addEventListener('keyup',e=>{if(e.code=='Space'){sp=0;el.style.cursor=''}});
function show(){const c=$('card');if(!sel){c.hidden=true;return}const t=I[lg],[yr,ty,tn,ti,wh,url,ap]=sel.userData.d;
 c.innerHTML='<i style="background:'+C[ty]+'"></i><small>'+t.T[ty]+' · '+(ap?'≈':'')+yr+'</small><h3>'+tx(ti)+'</h3><p>'+tx(wh)+'</p><p>'+(tn>.3?t.tone[0]:tn<-.3?t.tone[1]:t.tone[2])+'</p><a href="'+url+'" target="_blank" rel="noopener">'+t.src+'</a>';c.hidden=false}
// интерфейс
function upd(){pts.forEach(m=>{const u=m.userData;m.visible=ft.has(u.d[1])&&(fp<0||u.pi==fp)});
 const q=[];pts.forEach(m=>{if(m.visible){const p=m.userData.p0;q.push(p.x,p.y,p.z,p.x,FL,p.z)}});dls.geometry.setAttribute('position',new THREE.Float32BufferAttribute(q,3));
 if(sel&&!sel.visible)release();
 document.querySelectorAll('#leg button').forEach(b=>b.classList.toggle('off',!ft.has(+b.dataset.t)));
 document.querySelectorAll('.pr').forEach(b=>b.classList.toggle('sel',+b.dataset.p==fp))}
function render(){const t=I[lg];document.documentElement.lang=lg;$('h1').textContent=t.h;el.setAttribute('role','img');el.setAttribute('aria-label',t.h+' — '+t.sub);$('sub').textContent=t.sub;$('h2a').textContent=t.t;$('h2b').textContent=t.p;$('note').textContent=t.n;$('hint').textContent=t.hi;
 $('leg').innerHTML=t.T.map((n,i)=>'<button data-t="'+i+'"><i style="background:'+C[i]+'"></i>'+n+'<b>'+nT[i]+'</b></button>').join('');
 $('per').innerHTML=t.P.map((n,i)=>'<div class="pr" data-p="'+i+'"><div class="t"><span>'+n+'</span><em>'+PR[i][0]+'–'+PR[i][1]+'</em><b>'+tot[i]+'</b></div><div class="bar" style="width:'+(tot[i]/mx*100)+'%">'+cnt[i].map((k,j)=>k?'<span style="flex:'+k+';background:'+C[j]+'"></span>':'').join('')+'</div></div>').join('');
 document.querySelectorAll('#lg button').forEach(b=>b.classList.toggle('on',b.dataset.l==lg));labels();upd();show()}
$('lg').onclick=e=>{const b=e.target.closest('button');if(b){lg=b.dataset.l;render()}};
$('leg').onclick=e=>{const b=e.target.closest('button');if(!b)return;const t=+b.dataset.t;ft.has(t)?ft.delete(t):ft.add(t);upd()};
$('per').onclick=e=>{const b=e.target.closest('.pr');if(!b)return;const p=+b.dataset.p;fp=fp==p?-1:p;upd()};
render();
let t0=performance.now();
(function loop(now){const dt=Math.min((now-t0)/1000,.1)||0;t0=now;if(auto)A+=.0014;place();
 pts.forEach(m=>{const u=m.userData,k=m==sel?2:m==hov?1.7:1.3;u.k+=(k-u.k)*.15;m.scale.setScalar(u.k);m.position.y=u.p0.y+Math.sin(now/700+u.i)*(RM?0:.05)});
 R.render(S,cam);requestAnimationFrame(loop)})(t0);
</script></body></html>
